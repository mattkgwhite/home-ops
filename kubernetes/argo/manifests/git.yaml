---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgejo
  namespace: git
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-config
  namespace: git
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: forgejo-config
    creationPolicy: Owner
  data:
    - secretKey: ROOT_URL
      remoteRef:
        key: forgejo
        property: root-url
    - secretKey: database-user
      remoteRef:
        key: postgres.cluster01.forgejo.owner
        property: username
    - secretKey: database-password
      remoteRef:
        key: postgres.cluster01.forgejo.owner
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-admin
  namespace: git
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: forgejo-admin
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: forgejo-admin
        property: username
    - secretKey: email
      remoteRef:
        key: forgejo-admin
        property: email
    - secretKey: password
      remoteRef:
        key: forgejo-admin
        property: password
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-data
  namespace: git
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  storageClassName: hetzner-storagebox
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: git
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo
    spec:
      serviceAccountName: forgejo
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: bootstrap
          image: codeberg.org/forgejo/forgejo:15.0-rootless
          command:
            - /bin/sh
            - -ec
            - |
              case "${FORGEJO__server__ROOT_URL:?missing Forgejo root URL}" in
                http://*|https://*) ;;
                *) FORGEJO__server__ROOT_URL="https://$FORGEJO__server__ROOT_URL" ;;
              esac
              export FORGEJO__server__ROOT_URL="${FORGEJO__server__ROOT_URL%/}/"

              /usr/local/bin/docker-setup.sh
              forgejo -c "$GITEA_APP_INI" migrate

              admins="$(forgejo -c "$GITEA_APP_INI" admin user list --admin)"
              if ! printf '%s\n' "$admins" | awk -v username="$FORGEJO_ADMIN_USERNAME" '
                $1 ~ /^[0-9]+$/ && tolower($2) == tolower(username) { found = 1 }
                END { exit !found }
              '; then
                forgejo -c "$GITEA_APP_INI" admin user create --admin \
                  --username "$FORGEJO_ADMIN_USERNAME" \
                  --email "$FORGEJO_ADMIN_EMAIL" \
                  --password "$FORGEJO_ADMIN_PASSWORD"
              fi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: FORGEJO__server__ROOT_URL
              valueFrom:
                secretKeyRef:
                  name: forgejo-config
                  key: ROOT_URL
            - name: FORGEJO__server__DISABLE_SSH
              value: "true"
            - name: FORGEJO__database__DB_TYPE
              value: postgres
            - name: FORGEJO__database__HOST
              value: cluster01.postgres.svc.cluster.local:5432
            - name: FORGEJO__database__NAME
              value: forgejo
            - name: FORGEJO__database__USER
              valueFrom:
                secretKeyRef:
                  name: forgejo-config
                  key: database-user
            - name: FORGEJO__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: forgejo-config
                  key: database-password
            - name: FORGEJO__database__SSL_MODE
              value: require
            - name: FORGEJO__security__INSTALL_LOCK
              value: "true"
            - name: FORGEJO__service__DISABLE_REGISTRATION
              value: "true"
            - name: FORGEJO__security__REVERSE_PROXY_TRUSTED_PROXIES
              value: "127.0.0.0/8,::1/128"
            - name: FORGEJO__mailer__ENABLED
              value: "true"
            - name: FORGEJO__mailer__PROTOCOL
              value: smtp
            - name: FORGEJO__mailer__SMTP_ADDR
              value: mailpit.mailpit.svc.cluster.local
            - name: FORGEJO__mailer__SMTP_PORT
              value: "1025"
            - name: FORGEJO__mailer__FROM
              value: forgejo@git.rat-shilling.ts.net
            - name: FORGEJO_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: forgejo-admin
                  key: username
            - name: FORGEJO_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: forgejo-admin
                  key: email
            - name: FORGEJO_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: forgejo-admin
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/gitea
      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:15.0-rootless
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/gitea
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-data
---
apiVersion: v1
kind: Service
metadata:
  name: forgejo
  namespace: git
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: forgejo
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forgejo-tailscale
  namespace: git
  annotations:
    tailscale.com/funnel: "false"
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - git
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: forgejo
                port:
                  number: 80
