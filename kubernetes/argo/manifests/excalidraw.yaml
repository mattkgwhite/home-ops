apiVersion: v1
kind: Namespace
metadata:
  name: excalidraw
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: excalidraw
  namespace: excalidraw
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: excalidraw-tailscale-only
  namespace: excalidraw
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: excalidraw
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
          podSelector:
            matchLabels:
              tailscale.com/parent-resource: excalidraw-tailscale
              tailscale.com/parent-resource-ns: excalidraw
              tailscale.com/parent-resource-type: ingress
      ports:
        - protocol: TCP
          port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: excalidraw
  namespace: excalidraw
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: excalidraw
  template:
    metadata:
      labels:
        app.kubernetes.io/name: excalidraw
    spec:
      serviceAccountName: excalidraw
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: excalidraw
          image: excalidraw/excalidraw@sha256:f7ee194addd607bf831d2af0f0a34463dd4225e426cf35199ef0b12a803398e9
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              # The stock nginx master binds port 80 and starts workers as nginx.
              add:
                - CHOWN
                - NET_BIND_SERVICE
                - SETGID
                - SETUID
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: excalidraw
  namespace: excalidraw
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: excalidraw
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: excalidraw-tailscale
  namespace: excalidraw
  annotations:
    tailscale.com/hostname: draw
    tailscale.com/funnel: "false"
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - draw
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: excalidraw
                port:
                  number: 80
