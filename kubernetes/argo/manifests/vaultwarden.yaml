
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vaultwarden
  namespace: argocd
spec:
  destination:
    namespace: vaultwarden
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://github.com/mattkgwhite/home-ops.git
    targetRevision: main
    path: kubernetes/argo/manifests
    directory:
      include: vaultwarden.yaml
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
---
apiVersion: v1
kind: Namespace
metadata:
  name: vaultwarden
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vaultwarden-data
  namespace: vaultwarden
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  storageClassName: hcloud-volumes
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-warden
  namespace: vaultwarden
  labels:
    app: vault-warden
spec:
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: vault-warden
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: vault-warden
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - image: vaultwarden/server:1.37.4
        name: vault-warden
        env:
        - name: ROCKET_PORT
          value: "8080"
        - name: ENABLE_DB_WAL
          value: "false"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        volumeMounts:
        - name: data
          mountPath: /data
        ports:
        - name: http
          containerPort: 8080
        startupProbe:
          httpGet:
            path: /alive
            port: http
          failureThreshold: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /alive
            port: http
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /alive
            port: http
          periodSeconds: 30
          timeoutSeconds: 5
        resources:
          limits:
            cpu: "1"
            memory: 256Mi
            ephemeral-storage: 64Mi
          requests:
            cpu: 10m
            memory: 64Mi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: vaultwarden-data
          readOnly: false
---
apiVersion: v1
kind: Service
metadata:
  name: vault-warden
  namespace: vaultwarden
spec:
  selector:
    app: vault-warden
  ports:
  - protocol: TCP
    port: 80
    targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vault-warden-tailscale
  namespace: vaultwarden
  labels:
    tailscale.com/proxy-class: vaultwarden-proxy
  annotations:
    tailscale.com/hostname: warden
    tailscale.com/funnel: "false"
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - warden
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vault-warden
                port:
                  number: 80
---
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: vaultwarden-proxy
spec:
  statefulSet:
    pod:
      tailscaleContainer:
        env:
          - name: TS_DEBUG_DISABLE_UDP_GSO
            value: "true"