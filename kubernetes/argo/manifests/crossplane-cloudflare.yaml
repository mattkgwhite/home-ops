---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cf-dns
  namespace: crossplane-system
  # labels:
    # external-secrets.io/type: webhook
spec:
  refreshInterval: "5m"
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    creationPolicy: Owner
  data:
  # Cloudflare
    - secretKey: key-cloudflare
      remoteRef:
        key: cf-dns
        property: cloudflare-argo
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-cloudflare-runtime
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          containers:
            - name: package-runtime
              image: ghcr.io/millstonehq/provider-cloudflare:v0.1.0