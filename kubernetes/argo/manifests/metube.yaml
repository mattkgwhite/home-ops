---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metube
  namespace: argocd
spec:
  destination:
    namespace: metube
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://github.com/mattkgwhite/home-ops.git
    targetRevision: main
    path: kubernetes/argo/manifests
    directory:
      include: metube.yaml
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
---
apiVersion: v1
kind: Namespace
metadata:
  name: metube
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: metube-downloads
  namespace: metube
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  storageClassName: hetzner-storagebox
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 30Gi
