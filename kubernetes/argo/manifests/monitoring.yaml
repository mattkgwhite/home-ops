---
kind: Namespace
apiVersion: v1
metadata:
  name: observability
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    # Node exporter and Fluent Bit need host access on Talos.
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: cluster01.grafana.owner
  namespace: postgres
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "5m"
  secretStoreRefs:
    - name: 1password
      kind: ClusterSecretStore
  selector:
    secret:
      name: grafana-owner-user.cluster01.credentials.postgresql.acid.zalan.do
  data:
    - match:
        secretKey: username
        remoteRef:
          remoteKey: postgres.cluster01.grafana.owner
          property: username
    - match:
        secretKey: password
        remoteRef:
          remoteKey: postgres.cluster01.grafana.owner
          property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-postgres
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "5m"
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: postgres.cluster01.grafana.owner
        property: username
    - secretKey: password
      remoteRef:
        key: postgres.cluster01.grafana.owner
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "5m"
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    creationPolicy: Owner
    template:
      data:
        admin-user: admin
        admin-password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: grafana
        property: admin_password
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  destination:
    namespace: observability
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: grafana
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 8.15.0
    helm:
      releaseName: grafana
      valuesObject:
        admin:
          existingSecret: grafana-admin
        # Dashboards and users live in PostgreSQL; provision plugins through Helm.
        persistence:
          enabled: false
        datasources:
          datasources.yaml:
            apiVersion: 1
            deleteDatasources:
              - { name: Alertmanager, orgId: 1 }
              - { name: Loki, orgId: 1 }
              - { name: Prometheus, orgId: 1 }
            datasources:
              - name: Prometheus
                type: prometheus
                uid: prometheus
                access: proxy
                url: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
                isDefault: true
              - name: Loki
                type: loki
                uid: loki
                access: proxy
                url: http://loki-gateway.observability.svc.cluster.local
                jsonData:
                  maxLines: 250
        env:
          GF_SERVER_ROOT_URL: "https://grafana.rat-shilling.ts.net/"
          GF_DATABASE_TYPE: postgres
          GF_DATABASE_HOST: cluster01.postgres.svc.cluster.local:5432
          GF_DATABASE_NAME: grafana
          GF_DATABASE_SSL_MODE: require
          GF_AUTH_GENERIC_OAUTH_ENABLED: "false"
          GF_AUTH_DISABLE_LOGIN_FORM: "false"
        envValueFrom:
          GF_DATABASE_USER:
            secretKeyRef:
              key: username
              name: grafana-postgres
          GF_DATABASE_PASSWORD:
            secretKeyRef:
              key: password
              name: grafana-postgres
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: observability
  annotations:
    tailscale.com/hostname: grafana
    tailscale.com/funnel: "false"
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - grafana
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 80
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  destination:
    namespace: observability
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: kube-prometheus-stack
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 70.1.1
    helm:
      releaseName: kube-prometheus-stack
      valuesObject:
        grafana:
          enabled: false
        kubeApiServer:
          enabled: true
        kubelet:
          enabled: true
        kubeControllerManager:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
        alertmanager:
          alertmanagerSpec:
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: hcloud-volumes
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 10Gi
        prometheus:
          prometheusSpec:
            retention: 30d
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: hcloud-volumes
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 10Gi
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      allowEmpty: false
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  destination:
    namespace: observability
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: loki
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 6.28.0
    helm:
      releaseName: loki
      valuesObject:
        deploymentMode: SingleBinary
        backend:
          replicas: 0
        read:
          replicas: 0
        write:
          replicas: 0
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          compactor:
            working_directory: /var/loki/compactor/retention
            delete_request_store: filesystem
            retention_enabled: true
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
          storage:
            type: "filesystem"
          limits_config:
            retention_period: 720h
            max_query_length: 720h
        singleBinary:
          replicas: 1
          persistence:
            enabled: true
            enableStatefulSetAutoDeletePVC: false
            storageClass: hcloud-volumes
            size: 20Gi
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluentbit
  namespace: argocd
spec:
  destination:
    namespace: observability
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: fluent-bit
    repoURL: https://fluent.github.io/helm-charts
    targetRevision: 0.48.9
    helm:
      valuesObject:
        config:
          outputs: |
            [OUTPUT]
                name                   loki
                match                  *
                host                   loki-gateway.observability.svc.cluster.local
                port                   80
                labels                 job=fluentbit
                auto_kubernetes_labels on
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
