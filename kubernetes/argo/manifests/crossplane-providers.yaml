# Below are the provider configurations for Crossplane. 
# These are used to configure the providers that Crossplane will use to manage resources in your cluster.
---
kind: Namespace
apiVersion: v1
metadata:
  name: crossplane-system
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-opentofu
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  package: xpkg.upbound.io/upbound/provider-opentofu:v1.0.1
  runtimeConfigRef:
    apiVersion: pkg.crossplane.io/v1beta1
    kind: DeploymentRuntimeConfig
    name: tf-config
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-kubernetes
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-kubernetes:v1.3.1
  runtimeConfigRef:
    apiVersion: pkg.crossplane.io/v1beta1
    kind: DeploymentRuntimeConfig
    name: k8s-config
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-cloudflare
spec:
  package: ghcr.io/millstonehq/provider-cloudflare:xpkg
  runtimeConfigRef:
    name: provider-cloudflare-runtime