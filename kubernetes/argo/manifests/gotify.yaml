---
apiVersion: v1
kind: Namespace
metadata:
  name: gotify
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gotify-data
  namespace: gotify
spec:
  storageClassName: hcloud-volumes
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gotify
  namespace: gotify
automountServiceAccountToken: false
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gotify
  namespace: argocd
spec:
  destination:
    namespace: gotify
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: gotify
    repoURL: https://charts.gabe565.com
    targetRevision: 0.4.0
    helm:
      releaseName: gotify
      valuesObject:
        fullnameOverride: gotify
        image:
          repository: ghcr.io/gotify/server
          tag: 3.1.1
        controller:
          replicas: 1
          strategy: Recreate
        env:
          TZ: Europe/London
          GOTIFY_SERVER_PORT: "8080"
          GOTIFY_DEFAULTUSER_NAME: null
          GOTIFY_DEFAULTUSER_PASS: null
        serviceAccount:
          create: false
          name: gotify
        automountServiceAccountToken: false
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        service:
          main:
            ports:
              http:
                port: 80
                targetPort: 8080
        persistence:
          data:
            enabled: true
            existingClaim: gotify-data
        probes:
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: http
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: http
              periodSeconds: 30
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
  syncPolicy:
    automated:
      allowEmpty: false
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
