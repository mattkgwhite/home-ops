---
apiVersion: v1
kind: Namespace
metadata:
  name: homarr
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homarr-encryption
  namespace: homarr
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "5m"
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    creationPolicy: Owner
  data:
    - secretKey: SECRET_ENCRYPTION_KEY
      remoteRef:
        key: homarr-encryption
        # Keep this 64-character hex key stable to decrypt persisted integration secrets.
        property: homarr
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homarr-postgres
  namespace: homarr
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "5m"
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Spilo's generated certificate is self-signed; use TLS without certificate verification.
        DB_URL: 'postgresql://{{ .username | urlquery | replace "+" "%20" }}:{{ .password | urlquery | replace "+" "%20" }}@cluster01.postgres.svc.cluster.local:5432/homarr?sslmode=no-verify'
  data:
    - secretKey: username
      remoteRef:
        key: postgres.cluster01.homarr.owner
        property: username
    - secretKey: password
      remoteRef:
        key: postgres.cluster01.homarr.owner
        property: password
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homarr
  namespace: argocd
spec:
  destination:
    namespace: homarr
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://homarr-labs.github.io/charts/
    chart: homarr
    targetRevision: 8.43.1
    helm:
      valuesObject:
        strategyType: Recreate
        service:
          enabled: false
        rbac:
          enabled: true
        env:
          TZ: Europe/London
          PUID: "1000"
          PGID: "1000"
        database:
          type: postgresql
        envSecrets:
          dbCredentials:
            existingSecret: homarr-postgres
            dbUrlKey: DB_URL
          dbEncryption:
            existingSecret: homarr-encryption
            key: SECRET_ENCRYPTION_KEY
        podSecurityContext:
          seccompProfile:
            type: RuntimeDefault
        securityContext:
          allowPrivilegeEscalation: false
        readinessProbe:
          initialDelaySeconds: 0
          timeoutSeconds: 5
        livenessProbe:
          # The upstream chart has no startup probe. Allow the original startup budget.
          initialDelaySeconds: 300
          periodSeconds: 30
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 1Gi
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: v1
kind: Service
metadata:
  name: homarr
  namespace: homarr
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: homarr
    app.kubernetes.io/instance: homarr
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homarr-tailscale
  namespace: homarr
  annotations:
    tailscale.com/hostname: homarr
    tailscale.com/funnel: "false"
    tailscale.com/proxy-class: disable-udp-gso
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - homarr
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homarr
                port:
                  number: 80
